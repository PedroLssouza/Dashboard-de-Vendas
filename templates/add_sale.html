<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Venda</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            color: #333;
        }

        form {
            margin-top: 20px;
            max-width: 400px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #1d72b8;
            color: white;
            border: none;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #155a96;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #1d72b8;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1 data-testid="add-sale-title">Adicionar Nova Venda</h1>
    <form method="POST" data-testid="add-sale-form">
        <label for="client">Cliente:</label>
        <input type="text" name="client" id="client" placeholder="Nome do cliente" required>

        <label for="product">Produto:</label>
        <input type="text" name="product" id="product" placeholder="Nome do produto" required>

        <label for="value">Valor:</label>
        <input type="number" step="0.01" name="value" id="value" placeholder="Ex: 99.99" required>

        <label for="date">Data:</label>
        <input type="date" name="date" id="date" required>

        <input type="submit" value="Salvar">
    </form>

    <a href="/">← Voltar para lista de vendas</a>
</body>
</html>
